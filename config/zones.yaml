# 命名区域：归一化多边形（x,y 取 0-1，相对于画面宽高）。
# 相机固定后，用一张画面标定：把桌面划分成有意义的区域（抽屉/显示器下/书堆旁…）。
# 检测框中心点落在哪个多边形内，就归属哪个区域；都不在则记为「未分区」。
camera: default
regions:
  - name: 桌面左侧
    kind: surface
    polygon: [[0.0, 0.0], [0.36, 0.0], [0.36, 1.0], [0.0, 1.0]]
  - name: 桌面中央
    kind: surface
    polygon: [[0.36, 0.0], [0.68, 0.0], [0.68, 1.0], [0.36, 1.0]]
  - name: 桌面右侧
    kind: surface
    polygon: [[0.68, 0.0], [1.0, 0.0], [1.0, 1.0], [0.68, 1.0]]
  - name: 抽屉
    kind: container
    polygon: []          # 空多边形 = 暂未标定，不参与匹配