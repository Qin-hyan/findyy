    min_area: 0.0006
  - zh: 雨伞
    en: umbrella
    aliases: [雨伞, 伞, umbrella]
    threshold: 0.25
    min_area: 0.003
  - zh: 背包
    en: backpack
    aliases: [背包, 书包, 双肩包, backpack, bag]
    threshold: 0.25
    min_area: 0.004
  - zh: 苹果
    en: apple
    aliases: [苹果, apple]
    threshold: 0.50
    min_area: 0.001
  - zh: 香蕉
    en: banana
    aliases: [香蕉, banana]
    threshold: 0.45
    min_area: 0.001
  - zh: 勺子
    en: spoon
    aliases: [勺子, 调羹, 汤匙, spoon]
