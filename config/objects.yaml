# 交互式演示常用查询（UI 占位提示，不影响解析逻辑）
example_queries:
  - 我的钥匙最后出现在哪里？
  - 红色杯子在哪？
  - 手机是什么时候最后一次看到的？
  - 桌上都有哪些东西？
  - 鼠标移动过吗？
