<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <link rel="icon" href="/brand/favicon.ico?v=c360e51c8471" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/png/app-icon/findy-app-32.png?v=c360e51c8471" />
  <link rel="apple-touch-icon" sizes="192x192" href="/brand/png/app-icon/findy-app-192.png?v=c360e51c8471" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta property="og:site_name" content="Findy" />
  <meta property="og:image" content="/brand/og-image-1200x630.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <title>最近观察 · Findy</title>
  <link rel="stylesheet" href="/static/styles.css?v=20261109-3" />
  <link rel="stylesheet" href="/static/main.css?v=20261109-3" />
  <link rel="stylesheet" href="/static/warm.css?v=20261109-3" />
</head>
<body class="app-main" data-page="observe">
  <header class="app-header">
    <div class="app-header-main">
      <a class="app-brand" href="/" aria-label="Findy 首页">
        <img class="app-brand-logo" src="/brand/svg/logo-lockup.svg" alt="Findy" width="110" height="36" />
      </a>
      <nav class="app-nav" aria-label="主导航">
        <a href="/" data-nav="home">首页</a>
        <a href="/observe" data-nav="observe" class="is-active" aria-current="page">最近观察</a>
        <a href="/search" data-nav="search">找找物品</a>
        <a href="/items" data-nav="items">我的物品</a>
        <a href="/timeline" data-nav="timeline">观察时间线</a>
      </nav>
      <div class="app-header-actions">
        <span class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.2"/><path d="M5.2 20c.4-3.7 3-6 6.8-6s6.4 2.3 6.8 6"/></svg>
        </span>
      </div>
    </div>
  </header>

  <main class="app-page observe-page">
    <header class="page-heading observe-heading wm-enter" style="--enter-delay: 0ms">
      <div>
        <h1>最近观察</h1>
      </div>
      <span class="filter-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><circle cx="12" cy="12.5" r="3"/><path d="M8 6l1.2-2h5.6L16 6"/></svg>
        全部设备
      </span>
    </header>

    <section class="observe-feature wm-enter" style="--enter-delay: 90ms" aria-label="最近一次观察">
      <div class="capture-stage">
        <div class="viewport" id="viewport">
          <div class="placeholder" id="viewport-placeholder">
            <p>还没有抓拍记录</p>
          </div>
          <img id="capture-img" alt="最近一次抓拍" hidden />
          <div class="overlay" id="overlay"></div>

          <div class="summary-hotzone" id="summary-hotzone" aria-hidden="true"></div>
          <button class="summary-trigger" id="summary-trigger" type="button"
                  aria-expanded="false" aria-controls="summary-panel" aria-label="展开识别摘要">识别摘要</button>

          <section class="summary-panel" id="summary-panel" aria-hidden="true" aria-label="本帧识别摘要">
            <div class="summary-panel-head">
              <div>
                <h2>识别摘要</h2>
              </div>
              <button class="summary-pin" id="summary-pin" type="button" aria-pressed="false">固定</button>
            </div>
            <p class="summary-copy" id="capture-summary">正在读取最近一次观察…</p>
            <div class="detection-list" id="detections-list">
              <p class="empty-note">正在加载检测结果…</p>
            </div>
          </section>

          <div class="stage-badges" aria-live="polite">
            <span class="stage-badge stage-time" id="capture-time">—</span>
            <span class="stage-badge" id="stage-detections">—</span>
            <span class="source-badge src-unknown" id="capture-source">未知来源</span>
          </div>
        </div>
      </div>

      <aside class="observe-summary">
        <div class="observe-summary-top">
          <span class="source-badge src-esp32" id="observe-feature-source">真实设备</span>
          <span class="observe-id" id="observe-capture-id">—</span>
        </div>
        <time class="observe-time" id="observe-time">正在读取…</time>
        <p class="observe-zone" id="observe-zone">最近一次抓拍</p>

        <div class="observe-detected">
          <div class="observe-detected-head">
            <span>识别到的物品</span>
            <strong id="observe-detected-count">—</strong>
          </div>
          <div class="observe-detected-list" id="observe-detected-list">
            <span class="muted small">正在加载检测结果…</span>
          </div>
        </div>

        <div class="observe-actions">
          <button class="primary" id="capture-btn" type="button">立即抓拍</button>
          <button class="ghost" id="auto-btn" type="button">开始自动采集</button>
          <button class="text-button" id="observe-detail-btn" type="button">查看识别详情 <span aria-hidden="true">→</span></button>
          <span class="observe-status" id="capture-status"></span>
        </div>
      </aside>
    </section>

    <section class="observe-history wm-enter" style="--enter-delay: 170ms" aria-label="最近观察记录">
      <div class="section-head section-head-spaced">
        <h2>最近记录</h2>
        <a href="/timeline">观察时间线 <span aria-hidden="true">→</span></a>
      </div>
      <div class="observe-feed" id="observe-recent">
        <p class="empty-note">正在读取历史抓拍…</p>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Findy · 本地运行 · 图像与查询不上传 · 识别结果仅供参考</p>
    <p class="muted small"><a href="/workbench">验收工作台</a></p>
  </footer>

  <div class="toast hidden" id="toast"></div>
  <script src="/static/app.js?v=20261109-3"></script>
</body>
</html>
