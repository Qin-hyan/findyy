<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F6F3EC" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231D1B17'/%3E%3Ctext x='16' y='23' font-size='19' font-family='Segoe UI' font-weight='bold' text-anchor='middle' fill='%23FFFFFF'%3EF%3C/text%3E%3C/svg%3E" />
  <title>找找物品 · Findy</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/main.css" />
  <link rel="stylesheet" href="/static/warm.css" />
</head>
<body class="app-main" data-page="search">
  <header class="app-header">
    <div class="app-header-main">
      <a class="app-brand" href="/" aria-label="Findy 首页">
        <span class="logo app-logo">F</span>
        <span class="app-brand-copy"><strong>Findy</strong></span>
      </a>
      <nav class="app-nav" aria-label="主导航">
        <a href="/" data-nav="home">首页</a>
        <a href="/observe" data-nav="observe">最近观察</a>
        <a href="/search" data-nav="search" class="is-active" aria-current="page">找找物品</a>
        <a href="/items" data-nav="items">我的物品</a>
        <a href="/timeline" data-nav="timeline">观察时间线</a>
      </nav>
      <div class="app-header-actions">
        <span class="device-chip" id="header-device"><i aria-hidden="true"></i><span>本机检查中</span></span>
        <span class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.2"/><path d="M5.2 20c.4-3.7 3-6 6.8-6s6.4 2.3 6.8 6"/></svg>
        </span>
      </div>
    </div>
  </header>

  <main class="app-page search-page">
    <section class="search-hero">
      <div class="search-hero-copy wm-enter" style="--enter-delay: 0ms">
        <h1>找找你想要的物品</h1>
      </div>
      <figure class="search-hero-art wm-enter" style="--enter-delay: 90ms" aria-hidden="true">
        <img id="search-hero-img" alt="" hidden />
        <span class="search-art-label">最近一次本机观察</span>
      </figure>
    </section>

    <form class="search-bar wm-enter" id="query-form" style="--enter-delay: 150ms" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="query-input" type="search" placeholder="我的耳机在哪" autocomplete="off" aria-label="用自然语言询问物品位置" />
      <span class="query-intent" id="query-intent"></span>
      <button type="submit" aria-label="查找">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="search-workspace">
      <aside class="filter-panel wm-enter" style="--enter-delay: 210ms" aria-label="结果筛选">
        <div class="filter-panel-head">
          <span class="section-mark" aria-hidden="true"></span>
          <h2>筛选条件</h2>
        </div>
        <div class="filter-group">
          <h3>物品类型</h3>
          <div class="filter-list" id="filter-categories">
            <button class="filter-btn is-active" type="button" data-filter-category="all">
              <span>全部</span><span class="filter-count" id="count-all">—</span>
            </button>
          </div>
        </div>
        <div class="filter-group">
          <h3>时间范围</h3>
          <div class="filter-list" id="filter-ranges">
            <button class="filter-btn is-active" type="button" data-filter-range="all">
              <span class="filter-icon" aria-hidden="true">◷</span><span>全部时间</span>
            </button>
            <button class="filter-btn" type="button" data-filter-range="7">
              <span class="filter-icon" aria-hidden="true">◷</span><span>最近一周</span>
            </button>
            <button class="filter-btn" type="button" data-filter-range="30">
              <span class="filter-icon" aria-hidden="true">◷</span><span>最近一个月</span>
            </button>
            <button class="filter-btn" type="button" data-filter-range="custom" disabled title="暂未开放自定义日期">
              <span class="filter-icon" aria-hidden="true">◷</span><span>自定义时间</span>
            </button>
          </div>
        </div>
      </aside>

      <section class="search-results wm-enter" style="--enter-delay: 250ms" aria-live="polite">
        <div class="results-head">
          <strong id="result-count">正在读取本地物品库…</strong>
          <span class="sort-pill">最近优先 <span aria-hidden="true">⌄</span></span>
        </div>
        <div id="answer" class="answer help hidden"></div>
        <div id="results" class="results"></div>
      </section>
    </div>
  </main>

  <footer class="app-footer">
    <p>Findy · 本地运行 · 图像与查询不上传 · 识别结果仅供参考</p>
    <p class="muted small"><a href="/workbench">验收工作台</a></p>
  </footer>

  <div class="toast hidden" id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
