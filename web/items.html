<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <link rel="icon" href="/brand/favicon.ico?v=c360e51c8471" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/png/app-icon/findy-app-32.png?v=c360e51c8471" />
  <link rel="apple-touch-icon" sizes="192x192" href="/brand/png/app-icon/findy-app-192.png?v=c360e51c8471" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta property="og:site_name" content="Findy" />
  <meta property="og:image" content="/brand/og-image-1200x630.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <title>我的物品 · Findy</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/main.css" />
  <link rel="stylesheet" href="/static/warm.css" />
</head>
<body class="app-main" data-page="items">
  <header class="app-header">
    <div class="app-header-main">
      <a class="app-brand" href="/" aria-label="Findy 首页">
        <img class="app-brand-logo" src="/brand/svg/logo-lockup.svg" alt="Findy" width="110" height="36" />
      </a>
      <nav class="app-nav" aria-label="主导航">
        <a href="/" data-nav="home">首页</a>
        <a href="/observe" data-nav="observe">最近观察</a>
        <a href="/search" data-nav="search">找找物品</a>
        <a href="/items" data-nav="items" class="is-active" aria-current="page">我的物品</a>
        <a href="/timeline" data-nav="timeline">观察时间线</a>
      </nav>
      <div class="app-header-actions">
        <span class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.2"/><path d="M5.2 20c.4-3.7 3-6 6.8-6s6.4 2.3 6.8 6"/></svg>
        </span>
      </div>
    </div>
  </header>

  <main class="app-page items-page" id="items-page">
    <header class="page-heading items-heading wm-enter" style="--enter-delay: 0ms">
      <div>
        <h1>我的物品</h1>
      </div>
      <div class="items-mode-switch" role="group" aria-label="展示模式">
        <button class="items-mode-btn is-active" id="mode-orb" type="button" data-items-mode="orb" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="8" ry="3.2"/><path d="M12 4v16"/></svg>
          3D 球体
        </button>
        <button class="items-mode-btn" id="mode-grid" type="button" data-items-mode="grid" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg>
          平铺视图
        </button>
      </div>
    </header>

    <section class="orb-view wm-enter" id="orb-view" style="--enter-delay: 80ms" aria-label="物品球体">
      <div class="orb-stage" id="orb-stage" role="group" aria-roledescription="可拖动物品球" tabindex="0"
           aria-label="可拖动物品图片球" aria-describedby="orb-hint">
        <div class="orb-scene"><div class="orb-sphere" id="orb-sphere"></div></div>
      </div>
      <div class="orb-meta">
        <p class="orb-count" id="orb-count">共记录 <strong id="objects-count">—</strong> 件物品</p>
        <p class="orb-hint" id="orb-hint">拖动旋转 · 点击查看</p>
        <p class="orb-selection" id="orb-selection" aria-live="polite"></p>
      </div>
      <p class="orb-empty" id="orb-empty" hidden>还没有记录到物品</p>
    </section>

    <section class="grid-view" id="grid-view" aria-label="全部物品">
      <div class="items-toolbar">
        <div class="items-toolbar-copy">
          <h2>全部物品 <span id="grid-count">（—）</span></h2>
        </div>
        <span class="sort-pill">最近发现 <span aria-hidden="true">⌄</span></span>
      </div>
      <div class="object-grid" id="objects">
        <p class="empty-note">正在读取本地物品库…</p>
      </div>
    </section>
  </main>

  <div class="item-dialog" id="item-dialog" hidden>
    <div class="item-dialog-backdrop" data-item-close></div>
    <section class="item-sheet" role="dialog" aria-modal="true" aria-labelledby="item-dialog-title" aria-describedby="item-dialog-sub">
      <button class="item-dialog-close" type="button" data-item-close aria-label="关闭物品详情">×</button>
      <div class="item-sheet-body" id="item-dialog-body">
        <p class="empty-note">正在读取物品详情…</p>
      </div>
    </section>
  </div>

  <footer class="app-footer">
    <p>Findy · 本地运行 · 图像与查询不上传 · 识别结果仅供参考</p>
    <p class="muted small"><a href="/workbench">验收工作台</a></p>
  </footer>

  <div class="toast hidden" id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
