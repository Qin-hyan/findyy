<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F6F3EC" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231D1B17'/%3E%3Ctext x='16' y='23' font-size='19' font-family='Segoe UI' font-weight='bold' text-anchor='middle' fill='%23FFFFFF'%3EF%3C/text%3E%3C/svg%3E" />
  <title>Findy · 记住你的物品</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/main.css" />
  <link rel="stylesheet" href="/static/warm.css" />
</head>
<body class="app-main home-page" data-page="home">
  <header class="app-header">
    <div class="app-header-main">
      <a class="app-brand" href="/" aria-label="Findy 首页">
        <span class="logo app-logo">F</span>
        <span class="app-brand-copy"><strong>Findy</strong></span>
      </a>
      <nav class="app-nav" aria-label="主导航">
        <a href="/" data-nav="home" class="is-active" aria-current="page">首页</a>
        <a href="/observe" data-nav="observe">最近观察</a>
        <a href="/search" data-nav="search">找找物品</a>
        <a href="/items" data-nav="items">我的物品</a>
        <a href="/timeline" data-nav="timeline">观察时间线</a>
      </nav>
      <div class="app-header-actions">
        <span class="device-chip" id="header-device"><i aria-hidden="true"></i><span>本机检查中</span></span>
        <span class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.2"/><path d="M5.2 20c.4-3.7 3-6 6.8-6s6.4 2.3 6.8 6"/></svg>
        </span>
      </div>
    </div>
  </header>

  <main class="app-page home-wrap">
    <section class="home-hero" id="home-hero" aria-label="Findy 相机产品背景">
      <div class="hero-slide hero-slide--camera is-active" data-hero-slide aria-hidden="true"></div>
      <div class="hero-slide hero-slide--ecosystem" data-hero-slide aria-hidden="true"></div>
      <div class="hero-scrim" aria-hidden="true"></div>
      <div class="home-hero-inner">
        <div class="home-hero-copy wm-enter" style="--enter-delay: 0ms">
          <h1><span>Findy，</span><span>记住你的物品</span></h1>
          <p class="home-lede">自然界的Ctrl+F</p>
          <form class="hero-search" id="home-search-form" role="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
            <input id="home-search-input" type="search" placeholder="我的钥匙在哪" autocomplete="off" aria-label="询问 Findy 物品位置" />
            <button type="submit" aria-label="开始查找">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
            </button>
          </form>
        </div>
      </div>
      <div class="hero-dots" role="group" aria-label="背景切换">
        <button class="hero-dot is-active" type="button" data-hero-dot="0" aria-label="显示单品场景" aria-pressed="true"></button>
        <button class="hero-dot" type="button" data-hero-dot="1" aria-label="显示生态场景" aria-pressed="false"></button>
      </div>
    </section>

    <section class="home-sections">
      <section class="home-overview" aria-label="本机概览">
        <div class="section-head">
          <span class="section-mark" aria-hidden="true"></span>
          <h2>本机概览</h2>
        </div>
        <div class="overview-stats">
          <div class="overview-stat">
            <strong id="home-object-count">—</strong>
            <span>件物品</span>
          </div>
          <div class="overview-stat">
            <strong id="home-capture-count">—</strong>
            <span>条观察</span>
          </div>
          <div class="overview-stat">
            <strong id="home-device-state">—</strong>
            <span>设备状态</span>
          </div>
        </div>
      </section>

      <div class="home-content-grid">
        <section class="home-observation-section" aria-label="最近观察">
          <div class="section-head">
            <h2>最近观察</h2>
            <a href="/observe">查看全部 <span aria-hidden="true">→</span></a>
          </div>
          <a class="home-observation" id="home-capture" href="/observe">
            <div class="home-observation-media">
              <div class="home-observation-empty" id="home-capture-empty">还没有抓拍记录</div>
              <img id="home-capture-img" alt="最近一次抓拍" hidden />
              <span class="live-pill"><i aria-hidden="true"></i>最近一次观察</span>
            </div>
            <div class="home-observation-meta">
              <div class="home-observation-top">
                <span class="source-badge src-esp32" id="home-capture-source">真实设备</span>
                <time id="home-capture-time">—</time>
              </div>
              <div class="home-capture-objects" id="home-capture-objects">—</div>
            </div>
          </a>
        </section>

        <section class="home-objects-section" aria-label="最近记住的物品">
          <div class="section-head">
            <h2>最近记住的物品</h2>
            <a href="/items">查看全部 <span aria-hidden="true">→</span></a>
          </div>
          <div class="recent-objects" id="home-objects" aria-live="polite">
            <div class="mini-object is-skeleton"></div>
            <div class="mini-object is-skeleton"></div>
            <div class="mini-object is-skeleton"></div>
            <div class="mini-object is-skeleton"></div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Findy · 本地运行 · 图像与查询不上传 · 识别结果仅供参考</p>
    <p class="muted small"><a href="/workbench">验收工作台</a></p>
  </footer>

  <div class="toast hidden" id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
